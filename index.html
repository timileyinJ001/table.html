<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <!-- Tables are use to arrange data in rows and columns 
     column - Vertical
     Row - Horizontal
     th - table head
     tr - table row
     td - table data-->
     <table border="">
        <th>S/N</th>
        <th>Names</th>
        <th>Account Balance</th>
        <tr>
            <td>1</td>
            <td>David</td>
            <td>$10,000,000</td>
        </tr>
     

             <td>2</td>
            <td>Seun</td>
            <td>$20,000,000</td>
        </tr>

         <tr>
              <td>3</td>
            <td>Tolu</td>
            <td>$30,000,000</td>
        </tr>
        </table>
</body>
</html>
